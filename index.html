<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Плъшата Писта</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root{
  --ink:#0E1B26;
  --paper:#F4F5F0;
  --surface:#FFFFFF;
  --surface-2:#EAEBE4;
  --rule:#C9CCC2;
  --rule-soft:#DEE0D8;
  --text:#16242F;
  --text-dim:#5C6A72;
  --stamp:#C0392B;
  --ledger:#1F6F4A;
  --gold:#9C7620;
  --violet:#5B4B8A;
  --shadow:0 1px 0 rgba(14,27,38,.06), 0 8px 24px -14px rgba(14,27,38,.38);
  --disp:"Oswald","Arial Narrow",system-ui,sans-serif;
  --body:"Golos Text","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono","Consolas",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#06101A;
    --paper:#0E1B26;
    --surface:#16262F;
    --surface-2:#1D303A;
    --rule:#2E4450;
    --rule-soft:#223642;
    --text:#E4EAED;
    --text-dim:#93A5AF;
    --stamp:#E4695C;
    --ledger:#4FB487;
    --gold:#D6AC55;
    --violet:#A695D8;
    --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 30px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ink:#06101A;
  --paper:#0E1B26;
  --surface:#16262F;
  --surface-2:#1D303A;
  --rule:#2E4450;
  --rule-soft:#223642;
  --text:#E4EAED;
  --text-dim:#93A5AF;
  --stamp:#E4695C;
  --ledger:#4FB487;
  --gold:#D6AC55;
  --violet:#A695D8;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 30px -16px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  background:var(--paper);
  color:var(--text);
  font-family:var(--body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--disp);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--stamp);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

.wrap{max-width:1360px;margin:0 auto;padding:20px 18px 56px}

/* ---------- masthead ---------- */
.mast{
  display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  border-bottom:2px solid var(--text);padding-bottom:10px;margin-bottom:22px;flex-wrap:wrap;
}
.mast h1{font-size:clamp(26px,4vw,40px);text-transform:uppercase;letter-spacing:.06em;line-height:1}
.mast .sub{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim)}
.stampmark{
  font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:11px;font-weight:600;
  color:var(--stamp);border:1.5px solid var(--stamp);border-radius:3px;padding:4px 9px;
  transform:rotate(-2.5deg);white-space:nowrap;
}

/* ---------- setup ---------- */
.setup{display:grid;gap:22px;max-width:860px}
.intro{color:var(--text-dim);max-width:62ch}
.seat{background:var(--surface);border:1px solid var(--rule);box-shadow:var(--shadow);padding:16px 18px 18px;display:grid;gap:12px}
.seat-hd{display:flex;align-items:center;gap:9px;font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:13px;font-weight:600}
.dot{width:12px;height:12px;border-radius:50%;flex:none;border:1.5px solid var(--text)}
label.f{display:grid;gap:5px}
label.f > span{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim)}
input[type=text],select{
  font:inherit;background:var(--paper);color:var(--text);
  border:1px solid var(--rule);padding:8px 10px;width:100%;border-radius:2px;
}
.seat-row{display:grid;grid-template-columns:1fr 1.2fr 1.2fr;gap:12px}
@media(max-width:660px){.seat-row{grid-template-columns:1fr}}

.btn{
  font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-weight:600;font-size:13px;
  background:var(--text);color:var(--paper);border:1px solid var(--text);
  padding:10px 18px;cursor:pointer;border-radius:2px;transition:transform .08s ease, opacity .15s ease;
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;color:var(--text)}
.btn.stamp{background:var(--stamp);border-color:var(--stamp);color:#fff}
.btn.mini{padding:5px 10px;font-size:11px}
.btn[disabled]{opacity:.35;cursor:not-allowed;transform:none}

/* ---------- game layout ---------- */
.game{display:grid;grid-template-columns:1fr minmax(360px,600px) 1fr;gap:18px;align-items:start}
.game.solo{grid-template-columns:minmax(300px,420px) minmax(360px,600px);justify-content:center}
@media(max-width:1080px){.game.solo{grid-template-columns:1fr}}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.seg button{font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:600;
  background:transparent;border:0;padding:7px 14px;cursor:pointer;color:var(--text-dim)}
.seg button + button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--paper)}
.score{font-family:var(--mono);font-size:12px;color:var(--text-dim);letter-spacing:.04em}
@media(max-width:1080px){.game{grid-template-columns:1fr}}

/* ---------- statement ---------- */
.sheet{background:var(--surface);border:1px solid var(--rule);box-shadow:var(--shadow);position:relative}
.sheet.active{border-color:var(--stamp);box-shadow:0 0 0 1px var(--stamp), var(--shadow)}
.sheet-hd{display:flex;align-items:center;gap:9px;padding:12px 14px;border-bottom:1px solid var(--rule)}
.sheet-hd .who{font-family:var(--disp);font-size:17px;font-weight:600;line-height:1.1}
.sheet-hd .prof{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim)}
.turnflag{margin-left:auto;font-family:var(--disp);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--stamp);border:1px solid var(--stamp);padding:2px 6px}
.sec{padding:10px 14px;border-bottom:1px solid var(--rule-soft)}
.sec:last-child{border-bottom:0}
.sec > h3{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px;font-weight:500}
.line{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:1.5px 0}
.line .k{color:var(--text-dim);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px}
.line.tot{border-top:1px solid var(--rule);margin-top:5px;padding-top:5px;font-weight:600}
.line.tot .k{color:var(--text)}
.pos{color:var(--ledger)}
.neg{color:var(--stamp)}
.big{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 14px;background:var(--surface-2)}
.big .k{font-family:var(--disp);text-transform:uppercase;letter-spacing:.09em;font-size:12px}
.big .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:20px;font-weight:600}
.assetrow{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:2px 0;border-bottom:1px dotted var(--rule-soft)}
.assetrow:last-child{border-bottom:0}
.assetrow .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.assetrow .c{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ledger);flex:none}
.empty{font-size:12.5px;color:var(--text-dim);font-style:italic}
.goalbar{height:7px;background:var(--surface-2);border:1px solid var(--rule);position:relative;overflow:hidden;margin-top:6px}
.goalbar i{display:block;height:100%;background:var(--ledger);transition:width .4s ease}

/* ---------- board ---------- */
.boardwrap{display:grid;gap:14px}
.board{position:relative;aspect-ratio:1/1;width:100%;background:
  radial-gradient(circle at 50% 50%, var(--surface) 0 38%, transparent 38%),
  var(--surface);
  border:1px solid var(--rule);box-shadow:var(--shadow)}
.ringlabel{position:absolute;font-family:var(--disp);text-transform:uppercase;letter-spacing:.22em;font-size:10px;color:var(--text-dim);left:50%;transform:translateX(-50%)}
.tile{
  position:absolute;transform:translate(-50%,-50%);
  width:10.2%;aspect-ratio:1/1;border:1px solid var(--rule);background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-size:clamp(8px,1.7vw,12px);font-weight:600;letter-spacing:.03em;
  text-transform:uppercase;color:var(--text);border-radius:2px;cursor:help;
  overflow:hidden;text-align:center;line-height:1.05;padding:2px;
}
.board.ft .tile{width:8.4%}
.t-PAYDAY,.t-FLOW{background:color-mix(in srgb,var(--ledger) 16%,var(--surface));border-color:var(--ledger);color:var(--ledger)}
.t-DEAL,.t-INV{background:var(--surface);border-color:var(--rule);color:var(--text)}
.t-DOODAD,.t-TAX{background:color-mix(in srgb,var(--stamp) 14%,var(--surface));border-color:var(--stamp);color:var(--stamp)}
.t-MARKET,.t-BONUS{background:color-mix(in srgb,var(--gold) 18%,var(--surface));border-color:var(--gold);color:var(--gold)}
.t-CHARITY{background:color-mix(in srgb,var(--violet) 16%,var(--surface));border-color:var(--violet);color:var(--violet)}
.t-BABY,.t-DOWNSIZED{background:var(--surface-2);border-color:var(--text-dim);color:var(--text)}
.t-DREAM{background:color-mix(in srgb,var(--gold) 26%,var(--surface));border-color:var(--gold);color:var(--text);font-weight:700}
.tile.here{box-shadow:0 0 0 3px color-mix(in srgb,var(--stamp) 45%,transparent)}
.pawn{
  position:absolute;width:16px;height:16px;border-radius:50%;border:2px solid var(--surface);
  transform:translate(-50%,-50%);transition:left .32s cubic-bezier(.4,1.3,.5,1), top .32s cubic-bezier(.4,1.3,.5,1);
  z-index:3;box-shadow:0 2px 5px rgba(0,0,0,.35);
}

.center{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:46%;display:grid;gap:9px;justify-items:center;text-align:center;
}
.center .lead{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-dim)}
.center .nm{font-family:var(--disp);font-size:clamp(15px,2.6vw,22px);font-weight:600;line-height:1.1}
.dice{display:flex;gap:8px;justify-content:center}
.die{
  width:clamp(30px,5.4vw,42px);aspect-ratio:1/1;border:1.5px solid var(--text);border-radius:4px;
  background:var(--paper);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  padding:15%;gap:3%;
}
.die.rolling{animation:shake .32s ease}
@keyframes shake{0%{transform:rotate(0)}25%{transform:rotate(-12deg) scale(1.06)}75%{transform:rotate(12deg) scale(1.06)}100%{transform:rotate(0)}}
.pip{border-radius:50%;background:var(--text);align-self:center;justify-self:center;width:74%;aspect-ratio:1/1}

/* ---------- телефон ---------- */
@media (max-width:620px){
  .wrap{padding:14px 12px 40px}
  .mast{gap:10px;padding-bottom:8px;margin-bottom:16px}
  .mast h1{font-size:25px;letter-spacing:.04em}
  .mast .sub{font-size:9.5px;letter-spacing:.1em}
  .stampmark{font-size:10px;padding:3px 7px}

  /* дъската е важното — идва преди отчетите, за да не се търкаля до зара */
  .game{gap:14px}
  .game > .boardwrap{order:-1}

  /* по-големи квадрати и по-стегнат надпис, за да не излиза извън тях */
  /* плочките не бива да се застъпват: по обиколката им остават ~11% от дъската */
  /* по обиколката на дъската има място за 10% на плочка — повече се застъпват.
     Затова не растат, а надписът се пренася на два реда. */
  .tile{width:10%;font-size:clamp(6px,2.1vw,11px);letter-spacing:0;padding:1px;line-height:1;
    overflow-wrap:anywhere;hyphens:auto}
  .board.ft .tile{width:7%;font-size:clamp(5px,1.6vw,9px)}
  .center{width:58%;gap:7px}
  .center .lead{font-size:9px;letter-spacing:.1em}
  .die{width:32px}
  .ringlabel{font-size:9px;letter-spacing:.14em}

  .sheet-hd{padding:10px 12px}
  .sec{padding:9px 12px}
  .line{font-size:13.5px}
  .log{max-height:180px}

  /* пръст, не мишка: нищо под 38 пиксела и без увеличаване при фокус */
  .btn{padding:11px 16px}
  .btn.mini{padding:8px 12px;min-height:38px}
  input[type=text],select{font-size:16px;padding:10px}
  .seg button{padding:9px 16px;min-height:38px}
  .offer{gap:8px}
  .offer .gain{white-space:nowrap}

  .card{width:100%;max-height:92vh;border-radius:0}
  .card-hd,.card-bd,.card-ft{padding-left:14px;padding-right:14px}
  .card-ft{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--rule-soft)}
}

@media (max-width:380px){
  .center{width:60%}
  .mast h1{font-size:22px}
}

/* ---------- log ---------- */
.log{background:var(--surface);border:1px solid var(--rule);box-shadow:var(--shadow);max-height:230px;overflow:auto}
.log h3{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim);padding:9px 13px 5px;font-weight:500;position:sticky;top:0;background:var(--surface)}
.log ol{list-style:none;margin:0;padding:0 13px 11px;display:grid;gap:4px}
.log li{font-size:13px;display:flex;gap:8px;border-bottom:1px dotted var(--rule-soft);padding-bottom:4px}
.log li:last-child{border-bottom:0}
.log .tag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--text-dim);flex:none;padding-top:2px;min-width:26px;text-align:right}

.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
details.rules{background:var(--surface);border:1px solid var(--rule)}
details.rules summary{cursor:pointer;padding:9px 13px;font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:12px;font-weight:600}
details.rules .body{padding:0 13px 13px;font-size:13.5px;color:var(--text-dim);display:grid;gap:7px;max-width:70ch}
details.rules b{color:var(--text);font-weight:600}
details.rules .src{font-size:12px;color:var(--text-dim);opacity:.75;border-top:1px solid var(--rule-soft);padding-top:7px}

/* ---------- сгъваеми блокове и баланс ---------- */
details.blk{border-top:1px solid var(--rule)}
details.blk > summary{
  cursor:pointer;padding:10px 14px;list-style:none;
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--text-dim);display:flex;align-items:center;gap:8px;
}
details.blk > summary::-webkit-details-marker{display:none}
details.blk > summary::before{content:"+";font-family:var(--mono);font-size:14px;line-height:1;width:9px}
details.blk[open] > summary::before{content:"\2212"}
details.blk > summary:hover{color:var(--text)}
.blkbody{padding:0 14px 13px;display:grid;gap:13px}
.subh{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--text-dim);margin:0 0 5px;font-weight:500}
.duo{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--rule-soft)}
.duo > div{padding:9px 11px;min-width:0}
.duo > div + div{border-left:1px solid var(--rule-soft)}
.hint{font-size:11.5px;line-height:1.35;color:var(--text-dim);margin:0 0 7px}
.goal{padding:11px 14px;border-top:1px solid var(--rule-soft)}
.goal .cap{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--text-dim)}
.goal .cap b{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--text);font-weight:500}
.goal .cap.foot{margin-top:6px;font-size:11.5px}

/* ---------- легенда ---------- */
.legend{display:flex;flex-wrap:wrap;gap:6px}
.lg{display:flex;align-items:center;gap:7px;border:1px solid var(--rule-soft);
  background:var(--surface);padding:4px 9px;font-size:12px}
.lg i{width:9px;height:9px;border-radius:2px;flex:none;font-style:normal}
.lg b{font-family:var(--disp);font-size:11px;letter-spacing:.07em;font-weight:600}
.lg span{color:var(--text-dim)}
.lg.on{border-color:var(--stamp);background:color-mix(in srgb,var(--stamp) 8%,var(--surface))}
.lg.on span{color:var(--text)}
.center .field{font-family:var(--disp);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-dim);border-top:1px solid var(--rule-soft);padding-top:7px;width:100%}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 72%,transparent);display:grid;place-items:center;padding:18px;z-index:50}
.card{
  background:var(--surface);border:1px solid var(--rule);box-shadow:0 24px 60px -20px rgba(0,0,0,.6);
  width:min(520px,100%);max-height:88vh;overflow:auto;
}
.card-hd{padding:13px 18px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px}
.card-hd .kind{font-family:var(--disp);text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:600;padding:3px 8px;border:1.5px solid currentColor;border-radius:3px}
.card-hd h2{font-size:20px;margin-left:auto;text-align:right;font-weight:600}
.card-bd{padding:16px 18px;display:grid;gap:12px}
.card-bd p{margin:0;color:var(--text-dim);font-size:14px}
.terms{display:grid;gap:0;border:1px solid var(--rule-soft)}
.terms div{display:flex;justify-content:space-between;gap:12px;padding:6px 11px;font-size:13.5px;border-bottom:1px solid var(--rule-soft)}
.terms div:last-child{border-bottom:0}
.terms div:nth-child(odd){background:var(--surface-2)}
.terms .v{font-family:var(--mono);font-variant-numeric:tabular-nums}
.card-ft{padding:13px 18px;border-top:1px solid var(--rule);display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.warn{font-size:12.5px;color:var(--stamp);margin-right:auto}
.qty{display:flex;align-items:center;gap:7px;margin-right:auto}
.qty input{width:92px;font-family:var(--mono);text-align:right;background:var(--paper);color:var(--text);border:1px solid var(--rule);padding:6px 8px;border-radius:2px}
.qty span{font-family:var(--mono);font-size:11px;color:var(--text-dim)}
.offers{display:grid;gap:7px}
.offer{display:flex;align-items:center;gap:10px;border:1px solid var(--rule-soft);padding:8px 11px}
.offer .n{font-size:13.5px;min-width:0}
.offer .own{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim)}
.offer .gain{margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--ledger);flex:none}

.win{display:grid;gap:14px;justify-items:center;text-align:center;padding:40px 10px}
.win h2{font-size:clamp(28px,6vw,52px);text-transform:uppercase;letter-spacing:.04em}
.win .sub{color:var(--text-dim);max-width:52ch}
</style>

<div class="wrap">
  <header class="mast">
    <div>
      <h1>Плъшата Писта</h1>
      <div class="sub">Игра за паричен поток · сам или двама · един екран</div>
    </div>
    <div class="stampmark" id="stampmark">Кръг 1</div>
  </header>
  <main id="app"></main>
</div>

<script>
"use strict";

/* ============================ данни ============================ */

/* Всички числа по-долу са от публични данни за България, 2026 г.
   Заплати и осигуровки: НСИ, тримесечни данни; таван на осигурителния доход 2 300 €.
   Лихви: БНБ — среден лихвен процент по нови жилищни кредити 2,46%;
   потребителски кредити ~9,95%; кредитни карти ~14%.
   Издръжка на живота: КНСБ — 818 € за сам работещ, 1 473 € за тричленно семейство.
   Имоти: 2 300–4 000 €/кв.м София, 1 200–1 800 Пловдив, 1 400–2 500 Варна,
   1 200–2 000 Бургас; брутна доходност от наем 4,6% средно, 6–8% в Пловдив.
   Земеделска земя: ~870 €/декар, рента ~26 €/декар годишно. */
const RATES = {
  soc:      0.1378,  // лични осигуровки, трета категория труд
  socCap:   2300,    // максимален осигурителен доход от 01.08.2026
  income:   0.10,    // плосък данък върху доходите
  mortgage: 0.0246,  // средна лихва по нов жилищен кредит

  cardMin:  0.05,    // минимална месечна вноска по кредитна карта
  dsti:     0.50,    // БНБ, от 01.10.2024: вноските по всички кредити ≤ 50% от дохода
  ltv:      0.85,    // и кредитът ≤ 85% от стойността на имота
  rentTax:  0.09,    // 10% данък върху 90% от наема
  upkeep:   0.08,    // поддръжка, ремонти и празни месеци
};

/* една плочка ЗАПЛАТА е една изминала година: прибираш дванайсет месеца поток.
   Така и останалите събития идват с реална честота — по един непредвиден разход
   на година, съкращение веднъж на десетина години, дете веднъж на десетина. */
const MONTHS = 12;

/* месечна вноска като дял от главницата, при анюитетно погасяване */
const pmt = (rate, years) => { const r = rate / 12, n = years * 12; return r / (1 - Math.pow(1 + r, -n)); };
const PMT_HOME = pmt(RATES.mortgage, RATES.mortgageY);  // ≈ 0,45% месечно
const PMT_STUD = pmt(RATES.student,  RATES.studentY);   // ≈ 1,19%
const PMT_LOAN = pmt(RATES.consumer, RATES.consumerY);  // ≈ 2,12%

/* от бруто към удръжки: осигуровки до тавана, после 10% данък */
function payroll(gross){
  const soc = Math.min(gross, RATES.socCap) * RATES.soc;
  return Math.round(soc + (gross - soc) * RATES.income);
}
/* наем минус данък, поддръжка и вноската по ипотеката върху имота */
const netRent = (rent, debt) =>
  Math.round(rent * (1 - RATES.rentTax) * (1 - RATES.upkeep) - debt * PMT_HOME);

/* ---- сметки ---- */
const passive = p => p.assets.reduce((s, a) => s + (a.flow || 0), 0);
const income  = p => p.prof.salary + passive(p);
/* месечни помощи за дете, 2026: 26 € за едно, 57 € за две — с доходен тест
   от 466 € средномесечен доход на член от семейството. Отгоре идва данъчното
   облекчение: 3 067,75 € от годишната основа на дете, тоест 10% от тях обратно. */
const CHILD_AID = [0, 26, 57, 85];
function childSupport(p){
  if (!p.children) return 0;
  const relief  = p.children * 3067.75 * RATES.income / 12;
  const perHead = (p.prof.salary + passive(p)) / (2 + p.children);
  const aid     = perHead <= 466 ? CHILD_AID[Math.min(p.children, 3)] : 0;
  return Math.round(aid + relief);
}

function expenseLines(p){
  const q = p.prof, l = p.liab;
  const L = [
    ["Ипотека за дома",     Math.round(l.home   * PMT_HOME)],
    ["Студентски кредит",   Math.round(l.school * PMT_STUD)],
    ["Кредит за кола",      Math.round(l.car    * PMT_LOAN)],
    ["Кредитна карта",      Math.round(l.card   * RATES.cardMin)],
    ["Издръжка на живота",  q.other],
  ];
  if (p.children) L.push(["Деца (" + p.children + "), без надбавките", p.children * q.kid - childSupport(p)]);
  if (p.extra)    L.push(["Нови месечни разходи", p.extra]);
  if (l.retail) L.push(["Стоки на изплащане", Math.round(l.retail * RATES.cardMin)]);
  if (l.bank)   L.push(["Банков заем", Math.round(l.bank * PMT_LOAN)]);
  return L.filter(x => x[1] > 0);
}
const expenses = p => expenseLines(p).reduce((s, x) => s + x[1], 0);
const cashflow = p => income(p) - expenses(p);
const freed    = p => passive(p) >= expenses(p) && expenses(p) > 0;

/* всичко, което дължиш — вноските му седят в разходите */
function liabilityLines(p){
  const L = [
    ["Ипотека за дома", p.liab.home], ["Студентски кредит", p.liab.school],
    ["Кредит за кола", p.liab.car], ["Кредитна карта", p.liab.card],
    ["Стоки на изплащане", p.liab.retail], ["Банков заем", p.liab.bank],
  ];
  p.assets.forEach(a => { if (a.debt > 0) L.push(["Ипотека: " + a.name, a.debt]); });
  return L.filter(x => x[1] > 0);
}
const liabilities = p => liabilityLines(p).reduce((s, x) => s + x[1], 0);

/* ---- пари ---- */
/* всичко, което плащаш по кредити всеки месец */
const debtService = p => DEBTS.reduce((s, d) => s + p.liab[d.key] * d.rate(), 0);

/* колко още ти дава банката, без да минеш 50-те процента на БНБ */
function creditRoom(p){
  const room = income(p) * RATES.dsti - debtService(p);
  return Math.max(0, Math.floor(room / PMT_LOAN / 1000) * 1000);
}

/* колко струва един актив при бърза продажба: колкото си вложил, без печалба */
const bookValue = a => a.k === "stock" ? a.paid : (a.cost || 0) - (a.debt || 0);

function pay(p, amount, why){
  p.cash -= amount;
  log(p.name + " плаща " + money(amount) + " — " + why);

  while (p.cash < 0){
    const need = Math.ceil(-p.cash / 1000) * 1000;
    const room = creditRoom(p);
    if (room > 0){
      const take = Math.min(need, room);
      p.cash += take; p.liab.bank += take;
      log(p.name + " тегли принудителен заем " + money(take) + " (+" + money(take * PMT_LOAN) + " месечна вноска)");
      if (p.cash >= 0) break;
    }
    /* банката спря — остава да продаваш, при това набързо и без печалба */
    if (!p.assets.length) return bust(p);
    let i = 0;
    p.assets.forEach((a, j) => { if (bookValue(a) < bookValue(p.assets[i])) i = j; });
    const a = p.assets[i], got = Math.max(0, bookValue(a));
    p.assets.splice(i, 1);
    p.cash += got;
    log(p.name + " продава по принуда „" + a.name + "“ за " + money(got));
  }
}

/* краят, когато нито банката дава, нито има какво да се продаде */
function bust(p){
  const other = S.players.find(x => x !== p);
  log(p.name + " не може да плати и не му остана какво да продаде.");
  S.over = { p, other };
  render();
}
function earn(p, amount, why){ p.cash += amount; log(p.name + " получава " + money(amount) + " — " + why); }

function log(text){
  S.log.unshift({ t: S.round, text });
  if (S.log.length > 120) S.log.pop();
}

/* ============================ ход ============================ */

function cur(){ return S.players[S.turn]; }

function rollDice(){
  if (S.busy || S.modal) return;
  const p = cur();
  const n = (p.track === "ft" || p.charity > 0) && S.useTwo ? 2 : 1;
  S.busy = true; S.turns++;
  S.dice = Array.from({length:n}, () => 1 + Math.floor(Math.random() * 6));
  S.rolling = true;
  render();
  setTimeout(() => { S.rolling = false; move(p, S.dice.reduce((a, b) => a + b, 0)); }, 340);
}

function move(p, steps){
  const ring = p.track === "rat" ? RAT : FT;
  let i = 0;
  const step = () => {
    p.pos = (p.pos + 1) % ring.length;
    i++;
    if (p.track === "rat" && ring[p.pos] === "PAYDAY" && i < steps) payday(p);
    render();
    if (i < steps) setTimeout(step, 120);
    else setTimeout(() => land(p, ring[p.pos]), 180);
  };
  step();
}

function payday(p){
  const cf = cashflow(p) * MONTHS;
  if (cf >= 0) earn(p, cf, "изминава година (поток " + money(cashflow(p)) + " на месец)");
  else pay(p, -cf, "година с отрицателен паричен поток");
}

function land(p, type){
  S.busy = false;
  switch(type){
    case "PAYDAY": payday(p); return endTurn();
    case "DEAL":   return open({ m:"dealpick" });
    case "DOODAD": return open({ m:"doodad", card: pick(DOODADS.filter(d => !d.extra || !p.taken[d.name])) });
    case "MARKET": return open({ m:"market", card: pick(MARKET) });
    case "CHARITY":return open({ m:"charity" });
    case "BABY":   return open({ m:"baby" });
    case "DOWNSIZED": return open({ m:"downsized" });
    case "FLOW":   earn(p, p.ftFlow * MONTHS, "година в бързата писта"); return endTurn();
    case "INV":    return open({ m:"ftdeal", card: pick(FT_DEALS) });
    case "TAX":    pay(p, Math.round(p.cash * 0.10), "данъчна ревизия (10% от кеша)"); return endTurn();
    case "BONUS":  earn(p, FT_BONUS, "бонус от бързата писта"); return endTurn();
    case "DREAM":  return open({ m:"dream" });
  }
  endTurn();
}

function endTurn(){
  const p = cur();
  S.modal = null;
  if (p.track === "rat" && freed(p) && !p.offered){
    p.offered = true;
    return open({ m:"escape" });
  }
  if (p.track === "ft" && p.ftFlow >= p.ftTarget && p.ftTarget > 0){
    return win(p, "Пасивният доход в бързата писта порасна с " + money(FT_GOAL) + " на месец.");
  }
  if (p.charity > 0) p.charity--;
  let guard = 0;
  do {
    S.turn = (S.turn + 1) % S.players.length;
    if (S.turn === 0) S.round++;
    guard++;
    if (cur().skip > 0){ cur().skip--; log(cur().name + " пропуска хода си"); }
    else break;
  } while (guard < 12);
  S.dice = [];
  render();
}

function win(p, why){ S.winner = { p, why }; render(); }

/* ============================ модални карти ============================ */

function open(m){ S.modal = m; render(); }
function close(){ S.modal = null; render(); }

function buyAsset(p, card, kind){
  if (kind === "stock"){
    const n = Math.max(1, parseInt(document.getElementById("qty").value, 10) || 0);
    const cost = n * card.price;
    if (cost > p.cash) return;
    pay(p, cost, n + " дяла " + card.sym + " по " + money(card.price));
    const have = p.assets.find(a => a.k === "stock" && a.sym === card.sym);
    if (have){ have.paid += cost; have.shares += n; }
    else p.assets.push({ k:"stock", sym:card.sym, name:card.name, shares:n, paid:cost, flow:0 });
  } else {
    if (card.down > p.cash) return;
    pay(p, card.down, "първа вноска за „" + card.name + "“");
    p.assets.push({
      k:card.k, tag:card.tag, name:card.name, cost:card.cost, down:card.down,
      debt:card.cost - card.down, flow:card.flow,
    });
    if (card.cost > card.down) log("Ипотека " + money(card.cost - card.down) + " върху „" + card.name + "“");
  }
  endTurn();
}

function sellAsset(pl, idx, price){
  const a = pl.assets[idx];
  const net = price - (a.debt || 0);
  pl.assets.splice(idx, 1);
  if (net >= 0) earn(pl, net, "продажба на „" + a.name + "“ за " + money(price));
  else pay(pl, -net, "погасяване след продажба на „" + a.name + "“");
  render();
}

function sellStock(pl, idx, price){
  const a = pl.assets[idx];
  const gross = a.shares * price;
  pl.assets.splice(idx, 1);
  earn(pl, gross, a.shares + " дяла " + a.sym + " по " + money(price));
  render();
}

function loan(){
  const p = cur(), room = creditRoom(p);
  if (!room) return alert("Банката отказва. Вноските ти вече изяждат 50% от дохода — толкова позволява БНБ.");
  const n = Math.max(1, parseInt(prompt(
    "Колко да заемеш? (кратно на 1 000 €, до " + nf.format(room) + " €)", String(Math.min(10000, room))), 10) || 0);
  const amt = Math.min(Math.ceil(n / 1000) * 1000, room);
  p.cash += amt; p.liab.bank += amt;
  log(p.name + " тегли заем " + money(amt) + " (+" + money(amt * PMT_LOAN) + " месечна вноска)");
  render();
}
/* какво дължиш и колко ти струва всеки месец — вноската пада заедно с главницата */
const DEBTS = [
  {key:"bank",   name:"Банков заем",        rate:() => PMT_LOAN},
  {key:"card",   name:"Кредитна карта",     rate:() => RATES.cardMin},
  {key:"retail", name:"Стоки на изплащане", rate:() => RATES.cardMin},
  {key:"car",    name:"Кредит за кола",     rate:() => PMT_LOAN},
  {key:"school", name:"Студентски кредит",  rate:() => PMT_STUD},
  {key:"home",   name:"Ипотека за дома",    rate:() => PMT_HOME},
];

function repay(){ open({ m:"repay" }); }

function repayDebt(p, key, amt){
  p.cash -= amt; p.liab[key] -= amt;
  const d = DEBTS.find(x => x.key === key);
  log(p.name + " погасява " + money(amt) + " по „" + d.name + "“ (−" + money(amt * d.rate()) + " месечно)");
  render();
}

/* ============================ изглед ============================ */

const app = document.getElementById("app");
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

function render(){
  document.getElementById("stampmark").textContent =
    !S || !S.players.length ? "Нова партия" : S.solo ? "Ход " + S.turns : "Кръг " + S.round;
  app.innerHTML = "";
  if (!S || !S.players.length) return renderSetup();
  if (S.over) return renderBust();
  if (S.winner) return renderWin();
  renderGame();
  if (S.modal) renderModal();
}

function readSetup(){
  for (let i = 0; i < SETUP.count; i++){
    const n = document.getElementById("n" + i), pr = document.getElementById("p" + i), d = document.getElementById("d" + i);
    if (n)  SETUP.names[i]  = n.value;

/* най-добрият соло резултат живее в браузъра; ако е забранен, играта не забелязва */
const BEST_KEY = "kesh-kesh:best";
function bestScore(){
  try { return JSON.parse(localStorage.getItem(BEST_KEY)) || null; } catch (e) { return null; }
}
function saveScore(rec){
  try {
    const b = bestScore();
    if (!b || rec.turns < b.turns) localStorage.setItem(BEST_KEY, JSON.stringify(rec));
  } catch (e) { /* частен прозорец или забранено хранилище — няма страшно */ }
}

function blk(p, key, title, fill){
  const d = el("details", "blk");
  d.open = !!p.ui[key];
  d.appendChild(el("summary", null, esc(title)));
  const body = el("div", "blkbody");
  fill(body);
  d.appendChild(body);
  d.addEventListener("toggle", () => { p.ui[key] = d.open; });
  return d;
}

function ftSheet(p, s, act){
  s.appendChild(el("div", "big",
    '<span class="k">Месечен приход</span><span class="v pos">' + money(p.ftFlow) + "</span>"));
  s.appendChild(el("div", "big",
    '<span class="k">Налични пари</span><span class="v">' + money(p.cash) + "</span>"));

  const g = el("div", "goal");
  g.appendChild(el("div", "cap", "<span>Приход срещу целта</span><b>" + money(p.ftFlow) + " / " + money(p.ftTarget) + "</b>"));
  const bar = el("div", "goalbar");
  bar.innerHTML = "<i style='width:" + Math.min(100, p.ftTarget ? p.ftFlow / p.ftTarget * 100 : 0) + "%'></i>";
  g.appendChild(bar);
  g.appendChild(el("div", "cap foot",
    "<span>Мечта: " + esc(p.dream.name) + "</span><b>" + money(p.dream.price) + "</b>"));
  s.appendChild(g);

  s.appendChild(blk(p, "balance", "Активи · " + p.ftAssets.length + " на брой", body => {
    const A = el("div");
    A.appendChild(el("p", "hint", "Носят пари всеки месец."));
    if (!p.ftAssets.length) A.appendChild(el("p", "empty", "Парите чакат ден на приходите."));
    p.ftAssets.forEach(a => A.appendChild(el("div", "assetrow",
      '<span class="n">' + esc(a.name) + '</span><span class="c">+' + money(a.flow) + "</span>")));
    body.appendChild(A);
  }));
  return s;
}

/* ---- дъска ---- */
function board(){
  const w = el("div", "boardwrap");
  const b = el("div", "board");
  const anyFt = S.players.some(p => p.track === "ft");
  if (anyFt) b.classList.add("ft");

  const place = (ring, rad, cls, cur_) => ring.forEach((t, i) => {
    const a = -Math.PI / 2 + i / ring.length * Math.PI * 2;
    const x = 50 + Math.cos(a) * rad, y = 50 + Math.sin(a) * rad;
    const n = el("div", "tile t-" + t + (cur_ === i ? " here" : ""), ABBR[t]);
    n.style.left = x + "%"; n.style.top = y + "%";
    n.title = FULL[t] + (cls === "ft" && t === "DREAM" ? " — " + (DREAMS.find(d => d.tile === i) || {}).name : "");
    b.appendChild(n);
  });

  const ratR = anyFt ? 27 : 40;
  place(RAT, ratR, "rat", S.players.find(p => p.track === "rat" && p === cur()) ? cur().pos : -1);
  if (anyFt) place(FT, 44, "ft", cur().track === "ft" ? cur().pos : -1);

  S.players.forEach((p, k) => {
    const ring = p.track === "rat" ? RAT : FT;
    const rad = p.track === "rat" ? ratR : 44;
    const a = -Math.PI / 2 + p.pos / ring.length * Math.PI * 2;
    const off = (k === 0 ? -1 : 1) * 2.6;
    const pn = el("div", "pawn");
    pn.style.background = p.color;
    pn.style.left = (50 + Math.cos(a) * (rad + off)) + "%";
    pn.style.top = (50 + Math.sin(a) * (rad + off)) + "%";
    pn.title = p.name;
    b.appendChild(pn);
  });

  const c = el("div", "center");
  const p = cur();
  c.appendChild(el("div", "lead", p.track === "rat" ? "На ход е" : "Бърза писта · на ход е"));
  c.appendChild(el("div", "nm", esc(p.name)));

  const dc = el("div", "dice");
  const shown = S.dice.length ? S.dice : [0];
  shown.forEach(v => {
    const d = el("div", "die" + (S.rolling ? " rolling" : ""));
    const cells = [[],[5],[1,9],[1,5,9],[1,3,7,9],[1,3,5,7,9],[1,3,4,6,7,9]][v] || [];
    for (let i = 1; i <= 9; i++){
      const pip = el("div", cells.includes(i) ? "pip" : "");
      pip.style.gridArea = Math.ceil(i / 3) + " / " + ((i - 1) % 3 + 1);
      d.appendChild(pip);
    }
    dc.appendChild(d);
  });
  c.appendChild(dc);

  const roll = el("button", "btn stamp", S.dice.length ? "Хвърли пак" : "Хвърли зара");
  roll.onclick = rollDice;
  roll.disabled = !!S.modal || S.busy;
  c.appendChild(roll);

  if (p.charity > 0 || p.track === "ft"){
    const t = el("label", "lead");
    t.style.cursor = "pointer";
    t.innerHTML = '<input type="checkbox" id="two"' + (S.useTwo ? " checked" : "") + "> два зара";
    t.onclick = e => { if (e.target.id === "two") { S.useTwo = e.target.checked; } };
    c.appendChild(t);
  }
  if (S.dice.length)
    c.appendChild(el("div", "field", "Стои на: " + FULL[(p.track === "rat" ? RAT : FT)[p.pos]]));
  b.appendChild(c);
  w.appendChild(b);

  const ring = p.track === "rat" ? RAT : FT;
  const leg = el("div", "legend");
  (p.track === "rat" ? RAT_LEGEND : FT_LEGEND).forEach(([t, what]) => {
    const chip = el("div", "lg" + (ring[p.pos] === t ? " on" : ""));
    const sw = el("i"); sw.className = "sw t-" + t;
    chip.appendChild(sw);
    chip.appendChild(el("b", null, ABBR[t]));
    chip.appendChild(el("span", null, "— " + what));
    leg.appendChild(chip);
  });
  w.appendChild(leg);

  const lg = el("div", "log");
  lg.appendChild(el("h3", null, "Дневник"));
  const ol = el("ol");
  S.log.slice(0, 40).forEach(e =>
    ol.appendChild(el("li", null, '<span class="tag">' + e.t + "</span><span>" + esc(e.text) + "</span>")));
  lg.appendChild(ol);
  w.appendChild(lg);
  w.appendChild(rulesBox());
  return w;
}

function renderGame(){
  const g = el("div", "game" + (S.solo ? " solo" : ""));
  g.appendChild(sheet(S.players[0]));
  g.appendChild(board());
  if (S.players[1]) g.appendChild(sheet(S.players[1]));
  app.appendChild(g);
}

/* ---- модалът ---- */
function renderModal(){
  const m = S.modal, p = cur();
  const scrim = el("div", "scrim");
  const card = el("div", "card");
  const hd = el("div", "card-hd");
  const bd = el("div", "card-bd");
  const ft = el("div", "card-ft");

  const kind = (label, color) => {
    const k = el("span", "kind", label);
    k.style.color = color;
    hd.appendChild(k);
  };
  const title = t => hd.appendChild(el("h2", null, esc(t)));
  const terms = rows => {
    const t = el("div", "terms");
    rows.forEach(([k, v]) => t.appendChild(el("div", null,
      "<span>" + esc(k) + '</span><span class="v">' + v + "</span>")));
    bd.appendChild(t);
  };
  const btn = (label, fn, cls) => {
    const b = el("button", "btn " + (cls || "ghost"), label);
    b.onclick = fn; ft.appendChild(b); return b;
  };
  const skip = () => btn("Пропусни", endTurn);

  if (m.m === "repay"){
    kind("Банка", "var(--ledger)"); title("Погаси задължение");
    bd.appendChild(el("p", null, "Всяко погасено евро маха и вноската му от месечните разходи. Най-скъпият дълг се гаси пръв."));
    const open_ = DEBTS.filter(d => p.liab[d.key] > 0);
    if (!open_.length) bd.appendChild(el("p", null, "Нямаш задължения. Рядко и хубаво."));
    else {
      const list = el("div", "offers");
      open_.forEach(d => {
        const bal = p.liab[d.key], amt = Math.min(bal, Math.floor(p.cash / 1000) * 1000) || Math.min(bal, p.cash);
        const row = el("div", "offer");
        row.innerHTML = '<span class="n">' + esc(d.name) + '<br><span class="own">' + money(bal) +
          " · вноска " + money(bal * d.rate()) + " на месец</span></span>" +
          '<span class="gain">−' + money(Math.round(amt) * d.rate()) + "</span>";
        const b = el("button", "btn mini stamp", "Погаси " + money(amt));
        b.disabled = amt <= 0;
        b.onclick = () => { repayDebt(p, d.key, Math.round(amt)); };
        row.appendChild(b);
        list.appendChild(row);
      });
      bd.appendChild(list);
    }
    terms([["Налични пари", money(p.cash)], ["Месечни разходи", money(expenses(p))]]);
    btn("Затвори", close, "stamp");
  }

  if (m.m === "dealpick"){
    kind("Сделка", "var(--text)"); title("Малка или голяма");
    bd.appendChild(el("p", null, "Малките сделки искат по-малко пари в брой. Големите носят по-голям поток, но вратата е по-висока. " +
      "И в двата случая виждаш три оферти и взимаш най-много една."));
    btn("Малки сделки", () => open({ m:"deals", cards: draw(SMALL, 3) }), "stamp");
    btn("Големи сделки", () => open({ m:"deals", cards: draw(BIG, 3) }), "stamp");
    skip();
  }

  if (m.m === "deals"){
    kind("Сделка", "var(--text)"); title("Три оферти на масата");
    bd.appendChild(el("p", null, "Разгледай ги и вземи една — или подмини и трите."));
    const list = el("div", "offers");
    m.cards.forEach(c => {
      const price = c.k === "stock" ? money(c.price) + " на дял" : money(c.down) + " първа вноска";
      const gain  = c.k === "stock" ? c.sym : "+" + money(c.flow);
      const row = el("div", "offer");
      row.innerHTML = '<span class="n">' + esc(c.name) + '<br><span class="own">' + price + "</span></span>" +
        '<span class="gain">' + gain + "</span>";
      const b = el("button", "btn mini stamp", "Виж");
      b.onclick = () => open({ m:"deal", card: c, from: m.cards });
      row.appendChild(b);
      list.appendChild(row);
    });
    bd.appendChild(list);
    terms([["Налични пари", money(p.cash)]]);
    skip();
  }

  if (m.m === "deal"){
    const c = m.card;
    kind(c.k === "stock" ? "Дялове" : c.k === "re" ? "Имот" : "Бизнес", "var(--ledger)");
    title(c.name);
    bd.appendChild(el("p", null, esc(c.note || "")));
    if (c.k === "stock"){
      terms([["Цена на дял", money(c.price)], ["Символ", c.sym], ["Налични пари", money(p.cash)]]);
      const q = el("div", "qty");
      q.innerHTML = '<span>дяла</span><input type="number" id="qty" min="1" step="1" value="' +
        Math.max(1, Math.min(500, Math.floor(p.cash / c.price))) + '">';
      ft.appendChild(q);
      btn("Купи", () => buyAsset(p, c, "stock"), "stamp");
    } else {
      terms([
        ["Цена", money(c.cost)],
        ["Първа вноска", money(c.down)],
        ["Ипотека / дълг", money(c.cost - c.down)],
        ["Месечен поток", "+" + money(c.flow)],
        ["Налични пари", money(p.cash)],
      ]);
      const b = btn("Купи", () => buyAsset(p, c, c.k), "stamp");
      if (c.down > p.cash){
        b.disabled = true;
        ft.insertBefore(el("span", "warn", "Не ти стига кешът — изтегли заем или пропусни."), ft.firstChild);
      }
    }
    if (m.from) btn("Назад към офертите", () => open({ m:"deals", cards: m.from }));
    skip();
  }

  if (m.m === "doodad"){
    const c = m.card;
    kind("Разход", "var(--stamp)"); title(c.name);
    bd.appendChild(el("p", null, esc(c.note)));
    terms([["Сума", money(c.cost)], ["Налични пари", money(p.cash)]]);
    btn("Плати", () => {
      pay(p, c.cost, c.name);
      if (c.extra){
        p.extra += c.extra; p.taken[c.name] = true;
        log("Месечните разходи на " + p.name + " растат с " + money(c.extra));
      }
      endTurn();
    }, "stamp");
  }

  if (m.m === "baby"){
    kind("Дете", "var(--text)"); title("Раждане");
    if (p.children >= 2){
      bd.appendChild(el("p", null, "Две деца стигат. Разходите остават каквито са."));
      btn("Продължи", endTurn, "stamp");
    } else {
      bd.appendChild(el("p", null, "Семейството расте, а с него и месечната сметка."));
      terms([
        ["Разход на дете", money(p.prof.kid)],
        ["Деца досега", String(p.children)],
        ["Надбавки и облекчение", money(childSupport({children: p.children + 1, prof: p.prof, assets: p.assets}))],
      ]);
      btn("Приеми", () => {
        p.children++;
        log(p.name + " има " + p.children + " дете/деца (+" + money(p.prof.kid) + " месечно)");
        endTurn();
      }, "stamp");
    }
  }

  if (m.m === "charity"){
    kind("Дарение", "var(--violet)"); title("Дай, за да получиш избор");
    const amt = Math.round(income(p) * MONTHS * 0.10);
    bd.appendChild(el("p", null, "Дари 10% от годишния си доход и следващите три хода избираш дали да хвърляш с един или с два зара."));
    terms([["Годишен доход", money(income(p) * MONTHS)], ["Дарение", money(amt)], ["Налични пари", money(p.cash)]]);
    btn("Дари", () => { pay(p, amt, "дарение"); p.charity = 3; endTurn(); }, "stamp");
    skip();
  }

  if (m.m === "downsized"){
    kind("Съкращение", "var(--text)"); title("Останаха без теб");
    const months = 6, benefit = Math.round(Math.min(p.prof.gross, RATES.socCap) * 0.60);
    const hit = Math.max(0, (expenses(p) - benefit) * months);
    bd.appendChild(el("p", null, "Шест месеца без работа. Бюрото по труда плаща 60% от осигурителния ти доход, останалото вадиш от своето."));
    terms([
      ["Месечни разходи", money(expenses(p))],
      ["Обезщетение на месец", money(benefit)],
      ["Шест месеца недостиг", money(hit)],
      ["Налични пари", money(p.cash)],
    ]);
    btn("Приеми удара", () => { pay(p, hit, "шест месеца безработица"); p.skip = 2; endTurn(); }, "stamp");
  }

  if (m.m === "market"){
    const c = m.card;
    kind("Пазар", "var(--gold)"); title(c.name);
    bd.appendChild(el("p", null, esc(c.note)));

    if (c.k === "repair"){
      const hits = S.players.map(pl => pl.assets.filter(a => a.k === "re" && a.debt > 0).length);
      terms(S.players.map((pl, i) => [pl.name, hits[i] + " имота · " + money(hits[i] * c.cost)]));
      btn("Плати ремонтите", () => {
        S.players.forEach((pl, i) => { if (hits[i]) pay(pl, hits[i] * c.cost, "ремонт на покриви"); });
        endTurn();
      }, "stamp");
    } else if (c.k === "windfall"){
      terms([["Връщат ти", money(c.cost)]]);
      btn("Вземи", () => { earn(p, c.cost, c.name); endTurn(); }, "stamp");
    } else {
      const offers = [];
      S.players.forEach(pl => pl.assets.forEach((a, idx) => {
        if (c.k === "price" && a.k === "stock" && a.sym === c.sym)
          offers.push({ pl, idx, label: a.shares + " × " + a.sym, gain: a.shares * c.price, sell: () => sellStock(pl, idx, c.price) });
        if (c.k === "buyer" && a.k === "re" && a.tag === c.tag){
          const price = c.plus ? Math.round(a.cost * (1 + c.plus)) : c.price;
          offers.push({ pl, idx, label: a.name, gain: price - (a.debt || 0), sell: () => sellAsset(pl, idx, price) });
        }
        if (c.k === "bizbuyer" && a.k === "biz")
          offers.push({ pl, idx, label: a.name, gain: a.flow * c.mult, sell: () => sellAsset(pl, idx, a.flow * c.mult) });
      }));

      if (!offers.length){
        bd.appendChild(el("p", null, "Никой няма подходящ актив. Офертата отминава."));
      } else {
        const list = el("div", "offers");
        offers.forEach(o => {
          const row = el("div", "offer");
          row.innerHTML = '<span class="n">' + esc(o.label) + '<br><span class="own">' + esc(o.pl.name) + "</span></span>" +
            '<span class="gain">+' + money(o.gain) + "</span>";
          const b = el("button", "btn mini stamp", "Продай");
          b.onclick = () => { o.sell(); };
          row.appendChild(b);
          list.appendChild(row);
        });
        bd.appendChild(list);
      }
      btn("Приключи хода", endTurn, "stamp");
    }
  }

  if (m.m === "escape"){
    const pas = passive(p);
    kind("Изход", "var(--ledger)"); title("Край на плъшата писта");
    bd.appendChild(el("p", null, "Пасивният доход покрива разходите. Оттук нататък заплатата няма значение."));
    terms([
      ["Пасивен доход", money(pas)],
      ["Месечни разходи", money(expenses(p))],
      ["Поток в бързата писта", money(pas * FT_MULT)],
      ["Цел за победа", money(pas * FT_MULT + FT_GOAL)],
      ["Мечта", esc(p.dream.name) + " · " + money(p.dream.price)],
    ]);
    btn("Излез на бързата писта", () => {
      p.track = "ft"; p.pos = 0; p.ftFlow = pas * FT_MULT; p.ftTarget = pas * FT_MULT + FT_GOAL;
      p.escapedOn = S.turns;
      log(p.name + " излиза на бързата писта с поток " + money(p.ftFlow));
      S.modal = null;
      S.turn = (S.turn + 1) % S.players.length;
      if (S.turn === 0) S.round++;
      S.dice = [];
      render();
    }, "stamp");
  }

  if (m.m === "ftdeal"){
    const c = m.card;
    kind("Инвестиция", "var(--gold)"); title(c.name);
    bd.appendChild(el("p", null, "Голяма сделка от бързата писта. Плаща се изцяло в брой."));
    terms([["Цена", money(c.cost)], ["Месечен поток", "+" + money(c.flow)], ["Налични пари", money(p.cash)]]);
    const b = btn("Купи", () => {
      pay(p, c.cost, c.name);
      p.ftAssets.push(c); p.ftFlow += c.flow;
      log(p.name + " вдига потока си до " + money(p.ftFlow));
      endTurn();
    }, "stamp");
    if (c.cost > p.cash) b.disabled = true;
    skip();
  }

  if (m.m === "dream"){
    const mine = DREAMS.find(d => d.tile === p.pos);
    kind("Мечта", "var(--gold)"); title(mine ? mine.name : "Чужда мечта");
    if (!mine || mine.name !== p.dream.name){
      bd.appendChild(el("p", null, "Хубаво е, но не е твоето. Твоята мечта е „" + esc(p.dream.name) + "“."));
      btn("Продължи", endTurn, "stamp");
    } else {
      bd.appendChild(el("p", null, "Стигна до нея. Ако кешът стига, партията свършва тук."));
      terms([["Цена", money(mine.price)], ["Налични пари", money(p.cash)]]);
      const b = btn("Купи мечтата", () => { pay(p, mine.price, mine.name); win(p, "Купи „" + mine.name + "“."); }, "stamp");
      if (p.cash < mine.price) b.disabled = true;
      skip();
    }
  }

  card.appendChild(hd); card.appendChild(bd); card.appendChild(ft);
  scrim.appendChild(card);
  app.appendChild(scrim);
}

/* ---- победа ---- */
function renderBust(){
  const { p, other } = S.over;
  const w = el("div", "win");
  w.appendChild(el("div", "stampmark", "Дотук"));
  w.appendChild(el("h2", null, other ? esc(other.name) + " печели" : "Не се получи"));
  w.appendChild(el("p", "sub",
    esc(p.name) + " стигна тавана на БНБ — вноските изядоха 50% от дохода, банката спря да дава " +
    "и нямаше какво повече да се продаде."));
  w.appendChild(el("p", "sub",
    "Задължения " + money(liabilities(p)) + " · месечни вноски " + money(debtService(p)) +
    " срещу доход " + money(income(p)) + "."));
  if (S.solo)
    w.appendChild(el("p", "score", "Издържа " + S.turns + " хода. Следващия път гаси дълга по-рано."));
  const b = el("button", "btn stamp", S.solo ? "Пак" : "Нова партия");
  b.onclick = () => { S = null; render(); };
  w.appendChild(b);
  app.appendChild(w);
}

function renderWin(){
  const p = S.winner.p;
  const w = el("div", "win");
  w.appendChild(el("div", "stampmark", S.solo ? "Готово" : "Край на партията"));
  w.appendChild(el("h2", null, S.solo ? "Успя" : esc(p.name) + " печели"));
  w.appendChild(el("p", "sub", esc(S.winner.why)));
  w.appendChild(el("p", "sub",
    "Мечта: " + esc(p.dream.name) + " · кеш накрая " + money(p.cash)));

  if (S.solo){
    const rec = { turns: S.turns, prof: p.prof.name, dream: p.dream.name };
    const before = bestScore();
    saveScore(rec);
    w.appendChild(el("p", "sub",
      (p.escapedOn ? "Излезе от плъшата писта на ход " + p.escapedOn + " и с" : "С") +
      "печели на ход " + S.turns + "."));
    if (!before || S.turns < before.turns)
      w.appendChild(el("p", "score", before ? "Нов най-добър резултат. Старият беше " + before.turns + " хода."
                                            : "Това е първият ти резултат."));
    else
      w.appendChild(el("p", "score", "Най-добър резултат: " + before.turns + " хода · " + esc(before.prof) + "."));
  }

  const b = el("button", "btn stamp", S.solo ? "Пак" : "Нова партия");
  b.onclick = () => { S = null; render(); };
  w.appendChild(b);
  app.appendChild(w);
}

render();
</script>
